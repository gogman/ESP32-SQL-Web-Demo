; PlatformIO project configuration for SQLite_Web.
;
; This file tells PlatformIO which board the firmware is for, which libraries
; it needs, how the flash memory is divided, and how to upload and monitor.
;
; Common commands, run from the project folder:
;   pio run -e Release                build the firmware
;   pio run -e Release -t upload      build and upload the firmware
;   pio run -e Release -t uploadfs    build and upload the filesystem image
;                                     (the contents of the data folder)
;   pio device monitor                show the board's serial output
;
; Reference for every option: https://docs.platformio.org/page/projectconf.html

; ---------------------------------------------------------------------------
; Where PlatformIO keeps the toolchain, the framework and the tools.
; ---------------------------------------------------------------------------
[platformio]

; This project's own packages folder, instead of the one all projects share.
; The shared folder holds one copy of each package name, so a project on
; another ESP32 platform (for example pioarduino, with Arduino 3.x) replaces
; the framework and upload tool this project needs, and the build then fails
; or uses the wrong ones. The first build fills this folder (several hundred
; MB); it lives in PlatformIO's own folder, not in the project.
packages_dir = ${platformio.core_dir}/packages-sqlite-web

; ---------------------------------------------------------------------------
; Settings shared by every environment below.
; ---------------------------------------------------------------------------
[env]

; The toolchain and SDK for ESP32 chips. The exact version is pinned so the
; project keeps building the same way after PlatformIO updates itself.
platform = espressif32@7.1.3

; The board: a Freenove ESP32-WROVER. Its definition enables the 4 MB of
; external RAM (PSRAM) that the database cache relies on.
board = freenove_esp32_wrover

; Build on the Arduino core (setup(), loop(), WiFi, WebServer, ...).
framework = arduino

; The chip and its clock speed. 240 MHz is the fastest the ESP32 runs.
board_build.mcu = esp32
board_build.f_cpu = 240000000L

; The serial port the board is connected to, and the upload speed in baud.
; Change the port if Windows assigns the board a different COM number.
upload_port = COM4
upload_speed = 921600

; The serial monitor uses the same port. The speed must equal the value
; passed to LOG_BEGIN() in src/main.cpp (Debug build only).
monitor_port = COM4
monitor_speed = 115200

; "pio check" (static analysis) examines only this project's own code, not the
; framework and libraries.
check_skip_packages = yes

; How thoroughly PlatformIO searches for the libraries the code uses. "deep+"
; follows #include lines through all files and also evaluates #if conditions,
; which finds the framework libraries (WiFi, LittleFS, ...) that are used
; without being listed under lib_deps.
lib_ldf_mode = deep+

; External libraries, downloaded automatically. Sqlite3Esp32 is SQLite built
; for the ESP32; the version is pinned for the same reason as the platform.
lib_deps =
	siara-cc/Sqlite3Esp32@2.5.0

; How the 4 MB of flash is divided between firmware and filesystem; see the
; comments in defpart.csv.
board_build.partitions = defpart.csv

; The filesystem type for "uploadfs" and for the image built from the data
; folder. It must match what the firmware mounts (LittleFS in src/main.cpp).
board_build.filesystem = littlefs

; The pages are built into the firmware itself, compressed.
; tools/pack_page.py runs before every build and turns web/index.html (the
; application) and web/admin.html (the setup page) into .html.gz files;
; those are copied into the firmware, and src/web_handlers.cpp sends them
; straight from flash. After editing a page, rebuild and upload the firmware
; (not the filesystem).
; web/favicon.ico, the icon browsers show for the page, is built in the
; same way, as it is.
extra_scripts = pre:tools/pack_page.py
board_build.embed_files =
	web/index.html.gz
	web/admin.html.gz
	web/favicon.ico

; ---------------------------------------------------------------------------
; Release: the normal build, optimised and without debug logging.
; ---------------------------------------------------------------------------
[env:Release]
build_type = release

; ---------------------------------------------------------------------------
; Debug: for investigating problems. Larger and slower than Release.
; ---------------------------------------------------------------------------
[env:Debug]
build_type = debug

; The exception decoder turns the addresses in a crash report on the serial
; monitor into function names and line numbers.
monitor_filters = default, esp32_exception_decoder

; Log level 5 (verbose) makes the Arduino core print its own diagnostic
; messages, for example from the WiFi and filesystem code. SERIAL_LOG turns
; on the firmware's own serial output: startup and network messages, and how
; long each data request took (see include/Definitions.h). The Release build
; prints nothing of its own.
build_flags =
	-DCORE_DEBUG_LEVEL=5
	-DSERIAL_LOG=1
