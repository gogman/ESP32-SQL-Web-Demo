<!DOCTYPE html>
<html lang='en'>
<head>
<meta charset='utf-8'>
<meta name='viewport' content='width=device-width, initial-scale=1'>
<title>ESP32 Sqlite DB Demo</title>
<link rel='icon' href='/favicon.ico'>
<link rel='stylesheet' href='/bootstrap.min.css?v=5.3.8-1'>
<style>
.bi { vertical-align: -0.125em; }
#loading { z-index: 1090; background: rgba(0, 0, 0, 0.25); opacity: 0; visibility: hidden; }
#loading.show { opacity: 1; visibility: visible; transition: opacity 0.15s 0.15s; }
#head th { cursor: pointer; --bs-table-bg: var(--bs-primary-bg-subtle); --bs-table-color: var(--bs-primary-text-emphasis); }
</style>
<script>
function storedTheme() {
  try { return localStorage.getItem('theme') || 'auto'; } catch (error) { return 'auto'; }
}

function applyTheme(choice) {
  var dark = choice == 'dark' || (choice == 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.setAttribute('data-bs-theme', dark ? 'dark' : 'light');
}

applyTheme(storedTheme());
</script>
</head>
<body class='bg-body-tertiary'>
<header class='bg-primary text-white py-3 mb-4'>
<div class='container d-flex flex-wrap justify-content-between align-items-center gap-2'>
<h1 class='h4 mb-0'><a href="/" class='text-white text-decoration-none'>ESP32 Sqlite DB Demo</a></h1>
<div class='d-flex flex-wrap align-items-center gap-3'>
<span>Uptime: <span id='uptime'>...</span></span>
<div class='btn-group btn-group-sm' role='group' aria-label='Colour theme'>
<input type='radio' class='btn-check' name='theme' id='themeLight' value='light' autocomplete='off'>
<label class='btn btn-outline-light' for='themeLight' title='Light'><svg class='bi' width='16' height='16' fill='currentColor' viewBox='0 0 16 16' aria-hidden='true'><path d='M8 11a3 3 0 1 1 0-6 3 3 0 0 1 0 6m0 1a4 4 0 1 0 0-8 4 4 0 0 0 0 8M8 0a.5.5 0 0 1 .5.5v2a.5.5 0 0 1-1 0v-2A.5.5 0 0 1 8 0m0 13a.5.5 0 0 1 .5.5v2a.5.5 0 0 1-1 0v-2A.5.5 0 0 1 8 13m8-5a.5.5 0 0 1-.5.5h-2a.5.5 0 0 1 0-1h2a.5.5 0 0 1 .5.5M3 8a.5.5 0 0 1-.5.5h-2a.5.5 0 0 1 0-1h2A.5.5 0 0 1 3 8m10.657-5.657a.5.5 0 0 1 0 .707l-1.414 1.415a.5.5 0 1 1-.707-.708l1.414-1.414a.5.5 0 0 1 .707 0m-9.193 9.193a.5.5 0 0 1 0 .707L3.05 13.657a.5.5 0 0 1-.707-.707l1.414-1.414a.5.5 0 0 1 .707 0m9.193 2.121a.5.5 0 0 1-.707 0l-1.414-1.414a.5.5 0 0 1 .707-.707l1.414 1.414a.5.5 0 0 1 0 .707M4.464 4.465a.5.5 0 0 1-.707 0L2.343 3.05a.5.5 0 1 1 .707-.707l1.414 1.414a.5.5 0 0 1 0 .708'/></svg><span class='visually-hidden'>Light</span></label>
<input type='radio' class='btn-check' name='theme' id='themeDark' value='dark' autocomplete='off'>
<label class='btn btn-outline-light' for='themeDark' title='Dark'><svg class='bi' width='16' height='16' fill='currentColor' viewBox='0 0 16 16' aria-hidden='true'><path d='M6 .278a.77.77 0 0 1 .08.858 7.2 7.2 0 0 0-.878 3.46c0 4.021 3.278 7.277 7.318 7.277q.792-.001 1.533-.16a.79.79 0 0 1 .81.316.73.73 0 0 1-.031.893A8.35 8.35 0 0 1 8.344 16C3.734 16 0 12.286 0 7.71 0 4.266 2.114 1.312 5.124.06A.75.75 0 0 1 6 .278M4.858 1.311A7.27 7.27 0 0 0 1.025 7.71c0 4.02 3.279 7.276 7.319 7.276a7.32 7.32 0 0 0 5.205-2.162q-.506.063-1.029.063c-4.61 0-8.343-3.714-8.343-8.29 0-1.167.242-2.278.681-3.286'/></svg><span class='visually-hidden'>Dark</span></label>
<input type='radio' class='btn-check' name='theme' id='themeAuto' value='auto' autocomplete='off'>
<label class='btn btn-outline-light' for='themeAuto' title='Auto: follow the system setting'><svg class='bi' width='16' height='16' fill='currentColor' viewBox='0 0 16 16' aria-hidden='true'><path d='M0 4s0-2 2-2h12s2 0 2 2v6s0 2-2 2h-4q0 1 .25 1.5H11a.5.5 0 0 1 0 1H5a.5.5 0 0 1 0-1h.75Q6 13 6 12H2s-2 0-2-2zm1.398-.855a.76.76 0 0 0-.254.302A1.5 1.5 0 0 0 1 4.01V10c0 .325.078.502.145.602q.105.156.302.254a1.5 1.5 0 0 0 .538.143L2.01 11H14c.325 0 .502-.078.602-.145a.76.76 0 0 0 .254-.302 1.5 1.5 0 0 0 .143-.538L15 9.99V4c0-.325-.078-.502-.145-.602a.76.76 0 0 0-.302-.254A1.5 1.5 0 0 0 13.99 3H2c-.325 0-.502.078-.602.145'/></svg><span class='visually-hidden'>Auto</span></label>
</div>
</div>
</div>
</header>

<main class='container'>
<div id='problem' class='alert alert-danger' role='alert' hidden></div>
<div id='crash' class='alert alert-warning' role='alert' hidden></div>

<div class='card mb-4'>
<div class='card-body'>
<h2 class='card-title h5 mb-3'>Query Baby Names Database</h2>
<form method='GET' action='/' id='prefixForm' class='row g-2 align-items-center mb-3'>
<label for='prefix' class='col-sm-3 col-form-label'>Names Starting With</label>
<div class='col-sm'><input type='text' class='form-control' name='startswith' id='prefix'></div>
<div class='col-sm-auto'><button type='submit' class='btn btn-primary'>Search</button></div>
</form>
<form method='GET' action='/' id='rangeForm' class='row g-2 align-items-center'>
<label for='from' class='col-sm-3 col-form-label'>Names From</label>
<div class='col-sm'><input type='text' class='form-control' name='from' id='from' value='Bob'></div>
<label for='to' class='col-sm-auto col-form-label'>to</label>
<div class='col-sm'><input type='text' class='form-control' name='to' id='to' value='Bobby'></div>
<div class='col-sm-auto'><button type='submit' class='btn btn-primary'>Query database</button></div>
</form>
<div class='row g-2 align-items-center mt-1'>
<label for='sex' class='col-sm-3 col-form-label'>Primary Sex</label>
<div class='col-sm-auto'><select id='sex' class='form-select'><option value=''>All</option><option value='M'>Male</option><option value='F'>Female</option></select></div>
</div>
</div>
</div>

<div id='results' hidden>
<p id='status' class='text-body-secondary'></p>
<div class='d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3'>
<nav aria-label='Pages, above the table'><ul id='pagerTop' class='pagination flex-wrap mb-0' hidden></ul></nav>
<div class='d-flex align-items-center gap-2 ms-auto'><label for='perPageTop' class='text-nowrap'>Rows per page</label><select id='perPageTop' class='form-select form-select-sm w-auto'><option>10</option><option selected>25</option><option>50</option><option>100</option><option>200</option></select></div>
</div>
<div class='table-responsive'>
<table id='table' class='table table-sm table-striped table-hover table-bordered bg-body' hidden>
<thead id='head' class='user-select-none' title='Click a column to sort all rows of the search by it'><tr><th>Year</th><th>State</th><th>Name</th><th>Total babies</th><th>Primary Sex</th><th>Ratio</th><th>Per 100k</th></tr></thead>
<tbody id='rows'></tbody>
</table>
</div>
<div class='d-flex flex-wrap justify-content-between align-items-center gap-2 mb-4'>
<nav aria-label='Pages, below the table'><ul id='pagerBottom' class='pagination flex-wrap mb-0' hidden></ul></nav>
<div class='d-flex align-items-center gap-2 ms-auto'><label for='perPageBottom' class='text-nowrap'>Rows per page</label><select id='perPageBottom' class='form-select form-select-sm w-auto'><option>10</option><option selected>25</option><option>50</option><option>100</option><option>200</option></select></div>
</div>
</div>
</main>

<div id='loading' class='position-fixed top-0 start-0 w-100 h-100 d-flex justify-content-center align-items-center' role='status' aria-live='polite'>
<div class='d-flex flex-column align-items-center gap-2 bg-body text-body border rounded-3 shadow px-4 py-3'>
<div class='spinner-border text-primary' aria-hidden='true'></div>
<div>Loading...</div>
</div>
</div>

<script>
var COLUMNS = ['Year', 'State', 'Name', 'Total babies', 'Primary Sex', 'Ratio', 'Per 100k'];
var PAGERS = ['pagerTop', 'pagerBottom'];
var PER_PAGE = ['perPageTop', 'perPageBottom'];
var PAGES_AROUND = 4;

var query = null;
var searchId = 0;
var cursors = [null], starts = [0], page = 0;
var perPage = 25;
var sexFilter = '';
var total = null;
var pageRows = [], pageMore = false, pageError = '', pageLoaded = false;
var sortColumn = -1, sortDescending = false;
var dbVersion = '';
var loadNumber = 0;

function element(id) { return document.getElementById(id); }

function showLoading(on) { element('loading').classList.toggle('show', on); }

function setStatus(text) { element('status').textContent = text; }

function twoDigits(number) { return (number < 10 ? '0' : '') + number; }

function formatUptime(seconds) {
  var minutes = Math.floor(seconds / 60), hours = Math.floor(minutes / 60);
  return Math.floor(hours / 24) + 'd ' + hours % 24 + ':' + twoDigits(minutes % 60) + ':' + twoDigits(seconds % 60);
}

function startUptime(seconds) {
  var started = performance.now() - seconds * 1000;
  function tick() {
    element('uptime').textContent = formatUptime(Math.floor((performance.now() - started) / 1000));
  }
  tick();
  setInterval(tick, 1000);
}

function showProblem(text) {
  element('problem').textContent = text;
  element('problem').hidden = !text;
}

function readAddress() {
  var address = new URLSearchParams(location.search);
  if (address.has('startswith')) return { startswith: address.get('startswith') };
  if (address.has('from') || address.has('to')) return { from: address.get('from') || '', to: address.get('to') || '' };
  return null;
}

function requestParams() {
  var request = new URLSearchParams(query);
  if (sexFilter) request.set('sex', sexFilter);
  if (dbVersion) request.set('v', dbVersion);
  return request;
}

function fetchJson(url) {
  return fetch(url).then(function (response) {
    return response.json().then(function (data) {
      if (!response.ok && !data.error) data.error = 'HTTP ' + response.status;
      return data;
    });
  });
}

function startSearch(newQuery, startPage) {
  query = newQuery;
  searchId++;
  cursors = [null];
  starts = [0];
  page = startPage || 0;
  total = null;
  element('results').hidden = !query;
  if (!query) {
    loadNumber++;
    showLoading(false);
    return;
  }

  if ('startswith' in query) {
    element('prefix').value = query.startswith;
  } else {
    element('from').value = query.from;
    element('to').value = query.to;
  }

  load();
  loadTotal();
}

function load() {
  var id = searchId;
  var number = ++loadNumber;
  var request = requestParams();
  var after = sortColumn < 0 ? cursors[page] : null;
  request.set('limit', perPage);
  if (sortColumn >= 0) {
    request.set('sort', sortColumn);
    if (sortDescending) request.set('desc', 1);
  }
  if (after) {
    request.set('after_name', after[2]);
    request.set('after_year', after[0]);
    request.set('after_state', after[1]);
  } else if (page > 0) {
    starts[page] = page * perPage;
    request.set('offset', starts[page]);
  }

  showPager(false, false);
  pageLoaded = false;
  setStatus('Loading...');
  showLoading(true);

  fetchJson('/api/names?' + request)
    .then(function (data) { if (id == searchId) show(data); })
    .catch(function (error) {
      if (id != searchId) return;
      setStatus('Failed to fetch data: ' + error.message);
      showPager(true, false);
    })
    .then(function () { if (number == loadNumber) showLoading(false); });
}

function loadTotal() {
  var id = searchId;
  fetchJson('/api/count?' + requestParams())
    .then(function (data) {
      if (id != searchId || typeof data.count != 'number') return;
      total = data.count;
      if (pageLoaded) {
        showStatus();
        showPager(true, true);
      }
    })
    .catch(function () {});
}

function show(data) {
  pageRows = data.rows || [];
  pageMore = !!data.more;
  pageError = data.error || '';
  pageLoaded = true;

  if (pageMore) {
    cursors[page + 1] = pageRows[pageRows.length - 1];
    starts[page + 1] = starts[page] + pageRows.length;
  }

  render();
  showStatus();
  showPager(true, true);
}

function lastPage() {
  return total != null ? Math.max(Math.ceil(total / perPage) - 1, 0) : -1;
}

function addPageItem(list, label, target, enabled, name) {
  var item = document.createElement('li');
  var link = document.createElement(target == page ? 'span' : 'button');
  item.className = 'page-item' + (target == page ? ' active' : (enabled ? '' : ' disabled'));
  link.className = 'page-link';
  link.textContent = label;
  if (target == page) {
    link.setAttribute('aria-current', 'page');
  } else {
    link.type = 'button';
    link.disabled = !enabled;
    link.dataset.page = target;
    if (name) link.dataset.go = name;
  }
  item.appendChild(link);
  list.appendChild(item);
}

function showPager(back, ready) {
  var last = lastPage();
  var low = last < 0 ? page : Math.max(page - PAGES_AROUND, 0);
  var high = last < 0 ? page : Math.min(page + PAGES_AROUND, last);

  PAGERS.forEach(function (id) {
    var list = element(id);
    list.textContent = '';
    list.hidden = ready && page == 0 && !pageMore;
    addPageItem(list, 'First', -1, back && page > 0, 'first');
    addPageItem(list, 'Previous', -2, back && page > 0, 'previous');
    for (var number = low; number <= high; number++) addPageItem(list, number + 1, number, ready);
    addPageItem(list, 'Next', -3, ready && pageMore, 'next');
    addPageItem(list, 'Last', -4, ready && pageMore && last > page, 'last');
  });
}

function pagerClick(event) {
  var button = event.target.closest('button');
  if (!button || button.disabled) return;
  var target = Number(button.dataset.page);
  page = target == -1 ? 0 : target == -2 ? page - 1 : target == -3 ? page + 1 : target == -4 ? lastPage() : target;
  load();
}

function showStatus() {
  if (pageError) setStatus('Failed to fetch data: ' + pageError);
  else if (pageRows.length == 0) setStatus('No records found');
  else {
    var last = starts[page] + pageRows.length;
    var count = total != null ? total : (pageMore ? null : last);
    setStatus('Page ' + (page + 1) + (count != null ? ' of ' + Math.max(Math.ceil(count / perPage), 1) : '') +
              ' (' + (starts[page] + 1) + ' to ' + last + (count != null ? ' of ' + count : '') + ' records)');
  }
}

function showSortArrow() {
  var cells = element('head').rows[0].cells;
  for (var i = 0; i < cells.length; i++) {
    cells[i].textContent = COLUMNS[i] + (i == sortColumn ? (sortDescending ? ' ▼' : ' ▲') : '');
  }
}

function render() {
  var body = element('rows');

  showSortArrow();
  body.textContent = '';
  pageRows.forEach(function (row) {
    var line = body.insertRow();
    row.forEach(function (value, column) {
      var cell = line.insertCell();
      cell.textContent = column > 4 && typeof value == 'number' ? value.toFixed(2) : value;
      if (typeof value == 'number') cell.className = 'text-end';
    });
  });
  element('table').hidden = pageRows.length == 0;
}

function search(newQuery) {
  history.pushState(null, '', '/?' + new URLSearchParams(newQuery));
  startSearch(newQuery);
}

element('prefixForm').onsubmit = function (event) {
  event.preventDefault();
  search({ startswith: element('prefix').value });
};

element('rangeForm').onsubmit = function (event) {
  event.preventDefault();
  search({ from: element('from').value, to: element('to').value });
};

window.onpopstate = function () { startSearch(readAddress()); };

var themeChoice = storedTheme();

document.querySelectorAll('input[name=theme]').forEach(function (input) {
  input.checked = input.value == themeChoice;
  input.onchange = function () {
    themeChoice = input.value;
    try { localStorage.setItem('theme', themeChoice); } catch (error) {}
    applyTheme(themeChoice);
  };
});

matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function () {
  if (themeChoice == 'auto') applyTheme('auto');
});

PAGERS.forEach(function (id) { element(id).onclick = pagerClick; });

PER_PAGE.forEach(function (id) {
  element(id).value = perPage;
  element(id).onchange = function () {
    var firstRow = starts[page] || 0;
    perPage = Number(element(id).value);
    PER_PAGE.forEach(function (other) { element(other).value = perPage; });
    if (query) startSearch(query, Math.floor(firstRow / perPage));
  };
});

element('sex').onchange = function () {
  sexFilter = element('sex').value;
  if (query) startSearch(query);
};

element('head').onclick = function (event) {
  var cell = event.target.closest('th');
  if (!cell) return;
  if (sortColumn != cell.cellIndex) {
    sortColumn = cell.cellIndex;
    sortDescending = false;
  } else if (!sortDescending) {
    sortDescending = true;
  } else {
    sortColumn = -1;
    sortDescending = false;
  }
  showSortArrow();
  if (query) startSearch(query, page);
};

fetchJson('/api/status')
  .then(function (status) {
    startUptime(status.uptime);
    dbVersion = status.db_version || '';
    if (status.crash_dump) {
      element('crash').textContent = 'The firmware crashed at some point and saved a crash dump' +
        (status.crash_task ? ' (task ' + status.crash_task + ' at ' + status.crash_pc + ')' : '') +
        '. This notice stays until the dump is erased.';
      element('crash').hidden = false;
    }
    if (status.fs_mounted === false) {
      showProblem('The filesystem could not be mounted. Upload the filesystem image to the board.');
    } else if (status.db_open === false) {
      showProblem('The database could not be opened' + (status.db_error ? ': ' + status.db_error : '.'));
    }
  })
  .catch(function () { element('uptime').textContent = 'unknown'; })
  .then(function () { startSearch(readAddress()); });
</script>
</body>
</html>
